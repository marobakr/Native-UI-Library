<!--
  vf-tabs / button[vfTab] / vf-tab-panel
  Source of truth: Angular `vf-tabs` + `button[vfTab]` + `vf-tab-panel`
  (projects/ui/src/lib/tabs/tabs.ts)

  Structure: a `role="tablist"` container of `role="tab"` buttons, plus one or more
  `role="tabpanel"` elements as SIBLINGS (not nested inside the tablist - matches
  Angular, where panels usually sit next to `<vf-tabs>` rather than inside it).
  Tabs and panels are linked purely by id (`aria-controls` <-> `id`, `aria-labelledby`
  <-> tab id), exactly like the Angular version - accordion.js and tabs.js do not
  require any particular DOM nesting between the two.

  Required ids/attrs (author-set, no runtime id-generation - HTML-first architecture):
    tab:   id="<group>-tab-<value>"  aria-controls="<group>-panel-<value>"
           aria-selected="true|false" tabindex="0|-1" data-value="<value>"
    panel: id="<group>-panel-<value>" aria-labelledby="<group>-tab-<value>" hidden (if not active)

  Modifiers:
    .vf-tabs--vertical            on the root (default: horizontal)
    .vf-tabs__tab--selected       on the active tab button
    disabled attribute            on a disabled tab button (also skips it in arrow-key navigation)

  Keyboard (wired by tabs.js, mirrors Angular exactly - all 4 arrows work regardless
  of orientation): ArrowRight/ArrowDown = next enabled tab, ArrowLeft/ArrowUp = previous
  enabled tab (wraps), Home/End = first/last enabled tab. Click selects directly.
-->

<!-- Horizontal (default) - matches Angular's `Default` story exactly: 5 tabs, aria-label
     "Account sections", initially selected value "spend" (Spend details). -->
<div class="vf-tabs" data-component="tabs" role="tablist" aria-orientation="horizontal" aria-label="Account sections">
  <button
    type="button"
    class="vf-tabs__tab"
    role="tab"
    id="vf-tabs-1-tab-overview"
    aria-controls="vf-tabs-1-panel-overview"
    aria-selected="false"
    tabindex="-1"
    data-value="overview"
  >
    Overview
  </button>
  <button
    type="button"
    class="vf-tabs__tab"
    role="tab"
    id="vf-tabs-1-tab-solutions"
    aria-controls="vf-tabs-1-panel-solutions"
    aria-selected="false"
    tabindex="-1"
    data-value="solutions"
  >
    Solutions
  </button>
  <button
    type="button"
    class="vf-tabs__tab"
    role="tab"
    id="vf-tabs-1-tab-mobility"
    aria-controls="vf-tabs-1-panel-mobility"
    aria-selected="false"
    tabindex="-1"
    data-value="mobility"
  >
    Mobility
  </button>
  <button
    type="button"
    class="vf-tabs__tab vf-tabs__tab--selected"
    role="tab"
    id="vf-tabs-1-tab-spend"
    aria-controls="vf-tabs-1-panel-spend"
    aria-selected="true"
    tabindex="0"
    data-value="spend"
  >
    Spend details
  </button>
  <button
    type="button"
    class="vf-tabs__tab"
    role="tab"
    id="vf-tabs-1-tab-dashboard"
    aria-controls="vf-tabs-1-panel-dashboard"
    aria-selected="false"
    tabindex="-1"
    data-value="dashboard"
  >
    Add dashboard view
  </button>
</div>

<div class="vf-tabs__panel" role="tabpanel" id="vf-tabs-1-panel-overview" aria-labelledby="vf-tabs-1-tab-overview" tabindex="0" hidden>
  Overview content.
</div>
<div class="vf-tabs__panel" role="tabpanel" id="vf-tabs-1-panel-solutions" aria-labelledby="vf-tabs-1-tab-solutions" tabindex="0" hidden>
  Solutions content.
</div>
<div class="vf-tabs__panel" role="tabpanel" id="vf-tabs-1-panel-mobility" aria-labelledby="vf-tabs-1-tab-mobility" tabindex="0" hidden>
  Mobility content.
</div>
<div class="vf-tabs__panel" role="tabpanel" id="vf-tabs-1-panel-spend" aria-labelledby="vf-tabs-1-tab-spend" tabindex="0">
  Spend details content.
</div>
<div class="vf-tabs__panel" role="tabpanel" id="vf-tabs-1-panel-dashboard" aria-labelledby="vf-tabs-1-tab-dashboard" tabindex="0" hidden>
  Add dashboard view content.
</div>
