<!--
  vf-sidebar-nav demo markup.
  Verified against: projects/ui/src/lib/sidebar-nav/sidebar-nav.ts + sidebar-nav.stories.ts
  (Angular source, `master` branch, vf-dynamic-catalog-components).

  Every child (section label, item label/badge, user name/role/action) hides itself via a
  single `.vf-sidebar-nav--collapsed` modifier class cascading down from the root - there
  is no per-child "collapsed" state to keep in sync, matching Angular's approach where
  every child reads `collapsed()` off the same injected SidebarNavComponent.
-->
